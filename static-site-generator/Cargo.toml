[package]
name = "static-site-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive"] }

# Templating
tera = { version = "2.4", features = ["glob_fs"] }

# Markdown
pulldown-cmark = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.2"
csv = "1.4"

# File watching
notify = "8.2"

# Dev server
axum = "0.8"
tokio = { version = "1.54", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }

# Utilities
anyhow = "1.0"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
